site_name: libcivicclerk
site_description: Unofficial read-only Python client for the CivicClerk public meeting-portal API
site_url: https://chapinb.github.io/libcivicclerk/
repo_url: https://github.com/chapinb/libcivicclerk
repo_name: chapinb/libcivicclerk

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

exclude_docs: |
  specs/

nav:
  - Home: index.md
  - Usage guide: usage.md
  - API reference: api.md
  - Architecture decisions: decisions.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
