[project]
name = "libcivicclerk"
version = "0.1.0"
description = "Unofficial read-only Python client for the CivicClerk public meeting-portal API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chapin Bryce", email = "mail@chapinb.com" }
]
requires-python = ">=3.11"
keywords = ["civicclerk", "municipal", "government", "meetings", "open-data", "odata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
]

[project.urls]
Repository = "https://github.com/chapinb/libcivicclerk"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]
docs = [
    "mike>=2.2.0",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "RUF", # ruff-specific
    "D",   # pydocstyle -- public surface must be self-documenting
]
ignore = [
    "D105", # magic-method docstrings add no information
    "D107", # __init__ args are documented in the class docstring (google style)
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit a real CivicClerk tenant (deselected by default)",
]
addopts = "-m 'not live'"
