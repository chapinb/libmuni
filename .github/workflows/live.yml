name: Live contract

# Detects upstream CivicClerk API drift. The library's semver promise covers its
# own surface; the API underneath makes no promises, so this suite is how drift
# gets noticed instead of being reported by a caller. It does not gate merges.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  live:
    name: live contract suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Sync environment
        run: uv sync --locked
      # The suite skips itself when the tenant is unset, which would report a
      # green run of zero tests — the one failure mode that would quietly
      # disable drift detection forever. Fail loudly instead.
      - name: Require a tenant
        env:
          CIVICCLERK_TEST_TENANT: ${{ secrets.CIVICCLERK_TEST_TENANT }}
        run: |
          if [ -z "$CIVICCLERK_TEST_TENANT" ]; then
            echo "::error::CIVICCLERK_TEST_TENANT secret is not set; the live suite would skip silently."
            exit 1
          fi
      - name: Run the live suite
        env:
          # A repo secret: this is a public repo and must not name a specific
          # municipality.
          CIVICCLERK_TEST_TENANT: ${{ secrets.CIVICCLERK_TEST_TENANT }}
        run: uv run pytest -m live
