name: Docs

on:
  push:
    branches: [main] # unreleased docs, published under the `dev` alias
    tags: ["v*"] # a release, published under its version and `latest`

permissions:
  contents: write # mike commits the built site to the gh-pages branch

# Every deploy pushes to gh-pages; serialize so a release and a main push (or
# two main pushes) never race that push. Do not cancel an in-flight deploy —
# a half-finished mike push would leave gh-pages inconsistent.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # mike needs the gh-pages branch history
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Sync environment
        run: uv sync --locked --no-default-groups --group docs
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy this version as latest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Pin the generated llms.txt links to the version being published, so
          # an archived release's files never point at a newer one.
          export LLMS_BASE_URL="https://chapinb.com/libmuni/${TAG#v}/"
          uv run --group docs mike deploy --push --update-aliases "${TAG#v}" latest
          uv run --group docs mike set-default --push latest
      - name: Deploy main as dev
        if: github.ref == 'refs/heads/main'
        run: |
          # `dev` tracks the main branch; it never becomes the default, so the
          # site root keeps redirecting to the newest release (`latest`).
          export LLMS_BASE_URL="https://chapinb.com/libmuni/dev/"
          uv run --group docs mike deploy --push dev
