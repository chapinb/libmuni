name: Docs

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # mike commits the built site to the gh-pages branch

jobs:
  deploy:
    name: deploy versioned docs to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # mike needs the gh-pages branch history
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync --locked --no-default-groups --group docs
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy this version as latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Pin the generated llms.txt links to the version being published, so
          # an archived release's files never point at a newer one.
          export LLMS_BASE_URL="https://chapinb.github.io/libcivicclerk/${TAG#v}/"
          uv run --group docs mike deploy --push --update-aliases "${TAG#v}" latest
          uv run --group docs mike set-default --push latest
