name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: verify, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Sync environment
        run: uv sync --locked
      - name: Verify tag matches the packaged version and a dated changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag ${TAG} does not match pyproject version ${version}; refusing to publish"
            exit 1
          fi
          if ! grep -qE "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [${version}] - <date>' section"
            exit 1
          fi
      - name: Quality gate (lint, format, types, changelog)
        run: uvx prek run --all-files --show-diff-on-failure
      - name: Run tests
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing: OIDC in place of an API token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
